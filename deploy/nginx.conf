pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    gzip_static on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    # The current React interface owns the public root. Blazor is retained only
    # on the legacy hostname, with the same API and data behind both interfaces.
    map $host $utf_ui_root {
        default /usr/share/nginx/html/canary;
        old.unitedtacticalforces.de /usr/share/nginx/html;
    }

    server {
        listen 8080;
        server_name _;
        root $utf_ui_root;

        location = /appsettings.json {
            alias /usr/share/nginx/html/appsettings.json;
            # Preserve runtime public links while keeping both hosts' API calls
            # and authentication on their own origin. Never serve a sidecar here.
            gzip_static off;
            sub_filter_types application/json;
            sub_filter 'https://unitedtacticalforces.de/api/' '/api/';
            sub_filter_once off;
            add_header Cache-Control "no-store" always;
        }

        location = /Insignia-48px.png {
            root /usr/share/nginx/html;
        }

        location /media/generated/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
        }

        # Preserve the lowercase public URL used by the layouts. The published
        # asset has a capital I, which is a distinct path on Linux.
        location = /insignia-48px.png {
            alias /usr/share/nginx/html/Insignia-48px.png;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /api/ {
            # Match the API's existing upload limit and stream bodies to its validation.
            client_max_body_size 2g;
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location = /next {
            return 308 https://unitedtacticalforces.de/$is_args$args;
        }

        location ~ ^/next/(.*)$ {
            return 308 https://unitedtacticalforces.de/$1$is_args$args;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
