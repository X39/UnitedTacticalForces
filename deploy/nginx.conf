pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    error_log /dev/stderr warn;
    sendfile on;
    gzip_static on;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        '' $scheme;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Preserve the lowercase public URL used by the layouts. The published
        # asset has a capital I, which is a distinct path on Linux.
        location = /insignia-48px.png {
            alias /usr/share/nginx/html/Insignia-48px.png;
            add_header Cache-Control "public, max-age=86400" always;
        }

        location /api/ {
            # Match the API's existing upload limit and stream bodies to its validation.
            client_max_body_size 2g;
            proxy_pass http://api:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }

        location = /next {
            return 301 /next/$is_args$args;
        }

        location ^~ /next/assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /next/ {
            try_files $uri $uri/ /next/index.html;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
        }
    }
}
