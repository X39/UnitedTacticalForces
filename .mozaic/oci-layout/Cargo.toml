[package]
name = "utf-oci-layout"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[dependencies]
flate2 = "1"
goblin = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"
