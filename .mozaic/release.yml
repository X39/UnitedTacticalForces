# Trusted release: required checks and all publication inputs share one workspace.
version: 1
triggers:
  - trusted_branch
jobs:
  checked-artifacts:
    image: docker.io/library/rust@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    runs_on:
      labels:
        host-profile: fedora-44-cloud-v1
        workspace-storage: bounded-disk-v1
    resources:
      cpu_millis: 2000
      memory_mib: 8192
      scratch_mib: 65536
      pids: 512
      log_mib: 64
    network:
      mode: http_https
      allow_hosts:
        - nodejs.org
        - index.crates.io
        - static.crates.io
        - auth.docker.io
        - registry-1.docker.io
        - production.cloudfront.docker.com
        - mcr.microsoft.com
        - mcrprod.azureedge.net
        - westeurope.data.mcr.microsoft.com
        - api.nuget.org
        - globalcdn.nuget.org
        - registry.npmjs.org
        - snapshot.ubuntu.com
        - app.mozaic.space
        - steamcdn-a.akamaihd.net
        - cdn.playwright.dev
        - playwright.download.prss.microsoft.com
    timeout_minutes: 30
    steps:
      - name: Check Release binaries and package the complete component set
        run: sh .mozaic/build.sh release
      - name: Publish the checked API
        publish_in_package_registry:
          registry:
            id: 01a166b4-bc34-7973-a711-bf840c866313
          source:
            adapter: oci
            repository: utf/api
            path: images/api.tar
            format: oci_image_layout_tar_v1
            tags:
              - release
      - name: Publish the checked web application
        publish_in_package_registry:
          registry:
            id: 01a166b4-bc34-7973-a711-bf840c866313
          source:
            adapter: oci
            repository: utf/web
            path: images/web.tar
            format: oci_image_layout_tar_v1
            tags:
              - release
      - name: Publish the checked standard worker
        publish_in_package_registry:
          registry:
            id: 01a166b4-bc34-7973-a711-bf840c866313
          source:
            adapter: oci
            repository: utf/cloud-worker
            path: images/worker.tar
            format: oci_image_layout_tar_v1
            tags:
              - release
    test_results:
      - path: test-results/test-results/*.trx
        format: trx
      - path: test-results/auth-debug-results/*.trx
        format: trx
      - path: test-results/worker-test-results/*.trx
        format: trx
  activate-release:
    needs: [checked-artifacts]
    image: docker.io/library/rust@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    runs_on:
      labels:
        host-profile: fedora-44-cloud-v1
        workspace-storage: bounded-disk-v1
    resources:
      cpu_millis: 1000
      memory_mib: 512
      scratch_mib: 65536
      pids: 128
      log_mib: 8
    secret_files:
      ssh_key: managed-utf-ssh
      deployment_oci_read: deployment_oci_read
    deployment:
      target_id: c2cf220f-3b1e-4967-b413-87e9119d08bc
      environment: production
      release_job: checked-artifacts
      image_repositories: [applications/utf/api, applications/utf/web, applications/utf/cloud-worker]
    network:
      mode: http_https
      allow_hosts: [x39.mozaic.space]
      allow_connect:
        - host: '2a01:4f8:c0c:e2e::1'
          port: 22
    timeout_minutes: 15
    steps:
      - name: Deliver the exact checked UTF cohort to Amsel
        run: sh ci/deliver-release.sh
