# Trusted release. The React unit suite and the optional React browser suite run as parallel jobs of the same
# revision; the release job needs both and keeps the .NET checks, every publication input and the deployment in one
# workspace.
version: 1
triggers:
  - trusted_branch
jobs:
  react-tests:
    image: docker.io/library/rust@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    runs_on:
      labels:
        host-profile: fedora-44-cloud-v1
        workspace-storage: bounded-disk-v1
    resources:
      cpu_millis: 2000
      memory_mib: 4096
      scratch_mib: 65536
      pids: 512
      log_mib: 64
    network:
      mode: http_https
      allow_hosts:
        - nodejs.org
        - index.crates.io
        - static.crates.io
        - auth.docker.io
        - registry-1.docker.io
        - production.cloudfront.docker.com
        - mcr.microsoft.com
        - mcrprod.azureedge.net
        - westeurope.data.mcr.microsoft.com
        - registry.npmjs.org
        - cdn.playwright.dev
        - playwright.download.prss.microsoft.com
    timeout_minutes: 60
    steps:
      - name: Check React contracts, locales, formatting, lint, types and unit tests
        run: sh .mozaic/build.sh react-tests
  react-browser:
    image: docker.io/library/rust@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    runs_on:
      labels:
        host-profile: fedora-44-cloud-v1
        workspace-storage: bounded-disk-v1
    resources:
      cpu_millis: 2000
      memory_mib: 4096
      scratch_mib: 65536
      pids: 512
      log_mib: 64
    network:
      mode: http_https
      allow_hosts:
        - nodejs.org
        - index.crates.io
        - static.crates.io
        - auth.docker.io
        - registry-1.docker.io
        - production.cloudfront.docker.com
        - mcr.microsoft.com
        - mcrprod.azureedge.net
        - westeurope.data.mcr.microsoft.com
        - registry.npmjs.org
        - cdn.playwright.dev
        - playwright.download.prss.microsoft.com
    timeout_minutes: 60
    steps:
      - name: Run the optional React browser journeys (off unless UTF_BROWSER_TESTS=1)
        run: sh .mozaic/build.sh react-browser-optional
  checked-artifacts:
    needs:
      - react-tests
      - react-browser
    image: docker.io/library/rust@sha256:6ae102bdbf528294bc79ad6e1fae682f6f7c2a6e6621506ba959f9685b308a55
    runs_on:
      labels:
        host-profile: fedora-44-cloud-v1
        workspace-storage: bounded-disk-v1
    resources:
      cpu_millis: 2000
      memory_mib: 5632
      scratch_mib: 65536
      pids: 512
      log_mib: 64
    network:
      mode: http_https
      allow_hosts:
        - nodejs.org
        - index.crates.io
        - static.crates.io
        - auth.docker.io
        - registry-1.docker.io
        - production.cloudfront.docker.com
        - mcr.microsoft.com
        - mcrprod.azureedge.net
        - westeurope.data.mcr.microsoft.com
        - api.nuget.org
        - globalcdn.nuget.org
        - registry.npmjs.org
        - archive.ubuntu.com
        - security.ubuntu.com
        - unitedtacticalforces.de
        - cdn.playwright.dev
        - playwright.download.prss.microsoft.com
      allow_connect:
        - host: '2a01:4f8:c0c:e2e::1'
          port: 22
    timeout_minutes: 60
    steps:
      - name: Verify the organization deployment key before the long build
        run: sh ci/prepare-deploy-key.sh
      - name: Check Release binaries and package the complete component set
        run: sh .mozaic/build.sh release
      - name: Load the exact checked API and web images on Amsel over SSH
        run: python3 ci/stream_release.py --manifest deploy/production.json --target amsel --api images/api.tar --web images/web.tar
      - name: Back up the database, switch Amsel to the new images and prove the new revision is live
        run: python3 ci/activate_release.py --manifest deploy/production.json --target amsel --release release.json --revision "$MOZAIC_REVISION" --site https://unitedtacticalforces.de
      - name: Publish the checked API
        publish_in_package_registry:
          registry:
            id: 01a166b4-bc34-7973-a711-bf840c866313
          source:
            adapter: oci
            repository: utf/api
            path: images/api.tar
            format: oci_image_layout_tar_v1
            tags:
              - release
      - name: Publish the checked web application
        publish_in_package_registry:
          registry:
            id: 01a166b4-bc34-7973-a711-bf840c866313
          source:
            adapter: oci
            repository: utf/web
            path: images/web.tar
            format: oci_image_layout_tar_v1
            tags:
              - release
      - name: Publish the checked standard worker
        publish_in_package_registry:
          registry:
            id: 01a166b4-bc34-7973-a711-bf840c866313
          source:
            adapter: oci
            repository: utf/cloud-worker
            path: images/worker.tar
            format: oci_image_layout_tar_v1
            tags:
              - release
    test_results:
      - path: test-results/test-results/*.trx
        format: trx
      - path: test-results/auth-debug-results/*.trx
        format: trx
      - path: test-results/worker-test-results/*.trx
        format: trx
