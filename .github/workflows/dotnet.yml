# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.201
    - name: Restore dependencies
      run: dotnet restore X39.UnitedTacticalForces.slnx
    - name: Build
      run: dotnet build X39.UnitedTacticalForces.slnx --no-restore
    - name: Test
      run: dotnet test X39.UnitedTacticalForces.slnx --no-build --verbosity normal
    - name: Publish Backend
      run: dotnet publish sources/Api/Api.csproj -c Release --no-restore
    - name: Upload backend artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Backend"
        path: "sources/Api/bin/Release/net10.0/publish"
    - name: Publish frontend
      run: dotnet publish sources/WebApp/WebApp.csproj -c Release --no-restore
    - name: Upload frontend artifact
      uses: actions/upload-artifact@v4
      with:
        name: "Frontend"
        path: "sources/WebApp/bin/Release/net10.0/publish"
