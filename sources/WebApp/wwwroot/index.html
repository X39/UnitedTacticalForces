<!DOCTYPE html>
<html id="page-html" style="background: #150326">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>UTF</title>
    <base href="/"/>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet"/>
    <link href="_content/Microsoft.FluentUI.AspNetCore.Components/css/reboot.css" rel="stylesheet"/>
    <link href="X39.UnitedTacticalForces.WebApp.styles.css" rel="stylesheet"/>
    <link rel="stylesheet" href="css/app.css" />
    <script>
        // This is a workaround to make sure that the dark mode is applied before the page is rendered via Blazor.
        let html = window.document.getElementById("page-html");
        html.style.background = window.localStorage.getItem("UiConfiguration.DarkMode")
            ? "#1c033d"
            : "#ffffff"

        function page_clear_init_dark_mode() {
            window.document.getElementById("page-html").style.background = "";
        }

        window.utfCulture = {
            get: () => {
                const stored = window.localStorage.getItem("UtfCulture");
                if (stored) {
                    return stored;
                }

                const languages = navigator.languages && navigator.languages.length
                    ? navigator.languages
                    : [navigator.language || "en"];
                const supported = languages.find((language) => {
                    const normalized = (language || "").toLowerCase();
                    return normalized === "de"
                        || normalized.startsWith("de-")
                        || normalized === "en"
                        || normalized.startsWith("en-");
                });
                return supported || "en";
            },
            set: (culture) => window.localStorage.setItem("UtfCulture", culture)
        };
    </script>
</head>

<body>
<div id="app">
    <svg class="loading-progress">
        <circle r="40%" cx="50%" cy="50%" />
        <circle r="40%" cx="50%" cy="50%" />
    </svg>
    <div class="loading-progress-text"></div>
</div>

<div id="blazor-error-ui">
    <span class="blazor-error-message">An unhandled error has occurred.</span>
    <a href="" class="reload">Reload</a>
    <a class="dismiss">🗙</a>
</div>
<!-- Set the default theme -->
<script src="_content/Microsoft.FluentUI.AspNetCore.Components/js/loading-theme.js" type="text/javascript"></script>
<loading-theme storage-name="theme"></loading-theme>
<script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
<script src="js/forms.js"></script>
<script src="_content/Microsoft.FluentUI.AspNetCore.Components/Microsoft.FluentUI.AspNetCore.Components.lib.module.js"
        type="module" async></script>
<script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
